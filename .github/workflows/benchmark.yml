name: Offline benchmarks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node24:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      report: ${{ steps.golden.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Record runtime and checkout identity
        run: |
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1); console.log(process.version)'
          git rev-parse HEAD
          printf 'event_sha=%s\n' "$GITHUB_SHA"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - id: golden
        run: node --import tsx tests/golden/report-cli.ts export node >> "$GITHUB_OUTPUT"
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      report: ${{ steps.golden.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium-headless-shell
      - run: node tests/golden/run-browser.mjs
      - name: Retain synthetic layout evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bm3-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/bm3-layout/
          if-no-files-found: warn
          retention-days: 7
      - id: golden
        run: node --import tsx tests/golden/report-cli.ts export browser >> "$GITHUB_OUTPUT"
  golden-union:
    needs: [node24, chromium]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci
      - name: Require exact compatible 61 plus 7 case receipts
        env:
          GOLDEN_NODE: ${{ needs.node24.outputs.report }}
          GOLDEN_BROWSER: ${{ needs.chromium.outputs.report }}
        run: node --import tsx tests/golden/report-cli.ts combine-env
